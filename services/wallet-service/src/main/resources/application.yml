spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:mysql://localhost:3306/kessai_wallet?useSSL=false&allowPublicKeyRetrieval=true
    username: kessai
    password: kessai

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # DATETIME(6) has no timezone; without this Hibernate uses the JVM default (+07:00 here).
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.flywaydb: INFO
